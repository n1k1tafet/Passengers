[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dfmas"
version = "1.0.0"
description = "Dark Factory: мультиагентная система управления производством дизельного топлива"
requires-python = ">=3.10"
dependencies = [
  "numpy", "pandas", "pyarrow", "scipy", "scikit-learn", "PyYAML", "openpyxl",
]

[project.scripts]
dfmas = "dfmas.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::UserWarning", "ignore::FutureWarning"]
