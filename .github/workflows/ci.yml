name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install -r requirements.txt
      # Тесты, не требующие выданных данных (проверка чистоты импортов и кинетики)
      - run: PYTHONPATH=src python -m pytest tests/test_models.py -q
      - run: PYTHONPATH=src python -c "import dfmas.system, dfmas.cli, dfmas.dashboard; print('импорт ok')"
