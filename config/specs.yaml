# ---------------------------------------------------------------------------
# Спецификации качества.
#
# ИСТОЧНИКИ (важно для проверяющего):
#   [Э]   — подтверждено экспертом в ответах на вопросы команд;
#   [ТЗ]  — прямо записано в техническом задании;
#   [ГОСТ]— ГОСТ 32511-2013 (EN 590), взято как отраслевая норма;
#   [ДОП] — ДОПУЩЕНИЕ команды, в выданных материалах не подтверждено.
#
# Жёсткими (hard) считаются только те ограничения, которые названы в ТЗ и
# экспертом. Остальные — рекомендательные (advisory): их нарушение штрафуется
# в целевой функции, но не делает вариант недопустимым.
# ---------------------------------------------------------------------------
version: "1.0"

grades:

  HT_PRODUCT:                       # гидроочищенное ДТ на выходе установки 24-2000
    title: "ДТ с гидроочистки (полупродукт)"
    source: "[Э]"
    limits:
      Mg.Sulfur:   {max: 10.0,  unit: "mg/kg", hard: true,  source: "[ТЗ][Э]"}
      D15:         {min: 820.0, max: 845.0, unit: "kg/m3", hard: true, source: "[Э]"}
      # ЦЧ на этой стадии не нормируется — [Э]
      95%.T:       {max: 360.0, unit: "degC", hard: true,  source: "[Э][ГОСТ]"}
      FlashPoint:  {min: 55.0,  unit: "degC", hard: false, source: "[ГОСТ]"}

  DT_SUMMER:                        # ДТ летнее товарное
    title: "ДТ товарное, летнее (сорт C)"
    source: "[Э]"
    limits:
      Mg.Sulfur:   {max: 10.0,  unit: "mg/kg",  hard: true,  source: "[ТЗ][Э]"}
      D15:         {min: 820.0, max: 845.0, unit: "kg/m3",   hard: true,  source: "[Э]"}
      CetaneNumber: {min: 51.0,  unit: "cetane", hard: true,  source: "[Э]"}
      95%.T:       {max: 360.0, unit: "degC",   hard: true,  source: "[Э][ГОСТ]"}
      CFPP:        {max: -5.0,  unit: "degC",   hard: false, source: "[ГОСТ][ДОП]"}
      FlashPoint:  {min: 55.0,  unit: "degC",   hard: false, source: "[ГОСТ]"}

  DT_WINTER:                        # ДТ зимнее товарное
    title: "ДТ товарное, зимнее (класс 0)"
    source: "[Э]"
    limits:
      Mg.Sulfur:   {max: 10.0,  unit: "mg/kg",  hard: true,  source: "[ТЗ][Э]"}
      D15:         {min: 800.0, max: 845.0, unit: "kg/m3",   hard: true,  source: "[Э]"}
      CetaneNumber: {min: 49.0,  unit: "cetane", hard: true,  source: "[Э]"}
      95%.T:       {max: 360.0, unit: "degC",   hard: true,  source: "[Э][ГОСТ]"}
      CFPP:        {max: -20.0, unit: "degC",   hard: false, source: "[ГОСТ][ДОП]"}
      FlashPoint:  {min: 55.0,  unit: "degC",   hard: false, source: "[ГОСТ]"}

# Максимальный возраст измерения качества, после которого источник считается
# устаревшим и уверенность агента качества падает. [ДОП], обосновано периодом
# отбора проб ЛИМС (1-2 сут.) и шагом ПАК (10 мин).
staleness_hours:
  LIMS: 36.0
  PAK: 1.0
  TELEMETRY: 0.5
