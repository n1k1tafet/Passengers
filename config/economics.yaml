# ---------------------------------------------------------------------------
# Экономический прокси. ВСЕ ЧИСЛА — ДОПУЩЕНИЯ [ДОП].
# Фактических экономических данных в пакете нет, ТЗ прямо разрешает
# "прозрачный стоимостной прокси". Абсолютные значения не важны — важны
# соотношения, которые задают компромисс между качеством, выпуском и затратами.
#
# Единственное соотношение, заданное экспертом:
#   стоимость 1 т цетаноповышающей присадки = 100 x стоимость 1 т ДТ;
#   чем выше остаточная сера в ГО ДТ, тем дешевле его производство.
# ---------------------------------------------------------------------------
version: "1.0"
currency: "RUB"

prices:
  diesel_t: 55000.0            # ₽/т товарного ДТ [ДОП, условная база]
  cetane_additive_t: 5500000.0 # ₽/т = 100 x ДТ  [Э]
  straight_run_diesel_t: 45000.0  # ₽/т прямогонной фракции [ДОП]

# Переменные затраты гидроочистки
hydrotreater:
  # Печь: рост средневзвешенной температуры слоя на 1 °C при расходе сырья
  # 1 т/ч требует дополнительного тепла. Пересчитано в ₽/(°C * т сырья).
  fuel_cost_per_degC_per_t: 11.0     # ₽/(°C*т) [ДОП]
  # Водород: расход растёт с глубиной обессеривания
  h2_cost_per_nm3: 28.0              # ₽/нм3 [ДОП]
  h2_nm3_per_t_per_pct_S: 95.0       # нм3 H2 на тонну сырья на 1 % масс. удалённой серы [ДОП, литературная оценка]
  # Компрессия/рецикл — пропорционально расходу ВСГ
  recycle_cost_per_nm3: 1.4          # ₽/нм3 [ДОП]
  # Штраф за ускоренную дезактивацию катализатора: чем выше температура
  # относительно базовой, тем быстрее расходуется ресурс цикла.
  catalyst_cycle_cost: 42000000.0    # ₽ полная загрузка катализатора [ДОП]
  catalyst_base_cycle_days: 540      # сут при базовой WABT [ДОП]
  catalyst_deactivation_degC_per_doubling: 12.0  # +12 °C => ресурс вдвое меньше [ДОП, правило Аррениуса]

avt:
  furnace_cost_per_degC_per_t: 7.5   # ₽/(°C*т) нефти [ДОП]
