# Настройки агентов: пороги, веса, границы поиска. Все веса и пороги вынесены
# сюда, чтобы результат был воспроизводим и настраиваем без правки кода.
version: "1.0"

orchestrator:
  recommendation_step_minutes: 30     # [Э] допустимо 15..60 мин
  prediction_horizon_minutes: 120     # [Э] допустимо 0..180 мин
  # Приоритет ЛЕКСИКОГРАФИЧЕСКИЙ и реализован двумя уровнями отсева в
  # agents/optimizer.py: сначала отбрасываются варианты, нарушающие жёсткие
  # ограничения и запреты агента надёжности, и только потом сравниваются
  # оставшиеся. Веса ниже работают ТОЛЬКО внутри множества допустимых
  # вариантов, поэтому экономика здесь может иметь наибольший вес — она
  # физически не способна «перевесить» качество.
  objective_weights:
    economics: 1.00        # маржа = выручка минус переменные затраты
    reliability: 0.45      # предпочтение менее тяжёлому режиму при прочих равных
    quality_margin: 0.40   # предпочтение большему запасу по качеству
  # Минимальный экономический эффект, ниже которого вмешательство не предлагается
  # (защита от «дёрганья» установки). ₽/ч.
  min_action_benefit_rub_h: 4000.0
  # Максимальная вероятность нарушения ЖЁСТКОГО ограничения, при которой
  # вариант считается соответствующим спецификации. [ДОП] Выбран как «не более
  # одной партии из десяти». Для сравнения: на выданной истории доля
  # лабораторных результатов выше 10 мг/кг составляет 15.5 %, то есть сама
  # установка в среднем работает хуже этого порога.
  max_hard_exceed_prob: 0.10
  # Минимальный запас по жёстким ограничениям для варианта «ничего не делать»
  hold_margin_sigma: 1.0

data_quality:
  sentinel_values: [307.0]            # [Э] «307 — это выброс»
  flatline_samples: 18                # 3 ч неизменного значения => подозрение
  max_gap_minutes: 30
  min_valid_share: 0.80               # доля валидных MV/CV в окне
  cross_check:                        # согласованность независимых источников серы
    tolerance_mg_kg: 3.0

quality:
  confidence_level: 0.90              # покрытие конформных интервалов
  bias_correction_halflife_h: 24.0    # EWMA-коррекция смещения ВАК по ЛИМС/ПАК
  max_bias_correction: 3.0            # ограничение на величину коррекции (мг/кг)

reliability:
  # Мягкие модельные границы режима. ЯВНО ПОМЕЧЕНЫ КАК ДОПУЩЕНИЕ [ДОП]:
  # промышленные пределы в пакете не выданы, взяты как P1..P99 истории
  # в периоды нормальной работы, сужённые на 5 %.
  severity_weights:
    wabt: 0.40
    dp_reactor: 0.25
    quench: 0.15
    h2_to_oil: 0.20
  severity_alarm: 0.75                # индекс > порога => режим недопустим
  severity_warn: 0.55

optimizer:
  # Модельные диапазоны изменения MV за один шаг рекомендации [ДОП].
  # Ограничений по скорости эксперт не задал, поэтому шаг ограничен
  # консервативно — величиной, наблюдавшейся в истории за 30 мин (P95).
  max_step_fraction_of_p95: 1.0
  n_grid: 7                           # точек на каждую MV в сетке кандидатов
  pareto_max_options: 6
