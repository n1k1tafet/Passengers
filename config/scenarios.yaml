# ---------------------------------------------------------------------------
# Тестовые сценарии.
#
# Эксперт потребовал, чтобы сценарии НЕ были «жёсткими»: входные данные должны
# меняться, а результаты расчёта — меняться вслед за ними, в зависимости и от
# качества сырья, и от задания на качество продукции.
#
# Поэтому сценарий здесь — это не записанный ответ, а НАБОР ПОДМЕН над реальным
# историческим срезом:
#   at             — момент времени в истории (реальные данные);
#   grade          — задание на качество (марка товарного ДТ);
#   lab_overrides  — подмена лабораторных показателей (например, серы сырья);
#   overrides      — подмена значений тегов телеметрии;
#   tanks          — состав резервуаров для блендинга.
# Меняя любое поле, вы получаете другой расчёт теми же агентами.
# Команда: dfmas scenario <id>  |  dfmas scenario --all
# ---------------------------------------------------------------------------
version: "1.0"

scenarios:

  - id: steady
    title: "Устойчивый режим — система не создаёт лишних управляющих действий"
    why: >
      Проверка на ложные срабатывания. Данные полные и свежие, запас по всем
      жёстким ограничениям достаточен. Ожидаемое поведение — «режим без
      изменений»: сработала защита от дёрганья установки
      (min_action_benefit_rub_h в config/agents.yaml).
    at: "2024-09-15 20:00:00"
    grade: DT_SUMMER

  - id: feed_sulfur_up
    title: "Утяжеление сырья по сере — сценарий, описанный экспертом"
    why: >
      Изменилось содержание серы в нефти на АВТ, вслед за ним выросла сера в
      прямогонном ДТ. Режим гидроочистки должен быть скорректирован, чтобы
      выдержать 10 мг/кг в продукте. Система обязана предложить повышение
      температуры реактора и пересчитать блендинг.
      Меняйте значение lab_overrides -> HT_FEED:Mass.Sulfur и смотрите,
      как меняется требуемая температура.
    at: "2024-09-15 20:00:00"
    grade: DT_SUMMER
    lab_overrides:
      "HT_FEED:Mass.Sulfur": 1.35

  - id: feed_sulfur_up_tight
    title: "То же утяжеление сырья, но запаса по качеству мало — требуется вмешательство"
    why: >
      Тот же сценарий эксперта на режиме, где сера в продукте уже близка к
      нормативу. Здесь запаса нет, и система обязана предложить повышение
      температуры реактора. Сравните с feed_sulfur_up: одно и то же изменение
      сырья приводит к РАЗНЫМ решениям в зависимости от состояния процесса —
      это и есть «мягкий» сценарий, которого требовал эксперт.
      Развёрнутая зависимость решения от серы сырья: dfmas sweep.
    at: "2024-04-26 20:00:00"
    grade: DT_SUMMER
    lab_overrides:
      "HT_FEED:Mass.Sulfur": 1.60

  - id: cost_relax
    title: "Есть запас по качеству — экономия вместо перестраховки"
    why: >
      Сера в продукте заметно ниже норматива, запас по всем жёстким
      ограничениям достаточен. Эксперт указал: чем выше остаточная сера в
      гидроочищенном ДТ, тем дешевле его производство. Система обязана это
      использовать и предложить СНИЖЕНИЕ температуры реактора — при
      сохранении соблюдения спецификации. Проверяется, что оптимизация
      работает в обе стороны, а не только «поднять температуру».
    at: "2024-04-26 20:00:00"
    grade: DT_SUMMER

  - id: winter_grade
    title: "Смена задания на качество: переход на зимнее ДТ"
    why: >
      То же состояние процесса, другое задание. Требования по цетановому числу
      и плотности мягче, по ПТФ — жёстче. Проверяется, что рекомендация и
      рецептура блендинга меняются от ЗАДАНИЯ, а не только от данных.
    at: "2024-09-15 20:00:00"
    grade: DT_WINTER

  - id: stale_lab
    title: "Устаревшие и неполные данные — корректный отказ"
    why: >
      Лабораторный анализ серы сырья отсутствует, поточный анализатор помечен
      непригодным. Ожидаемое поведение — отказ от рискованной рекомендации с
      названной причиной. Умение отказаться прямо названо в ТЗ частью
      качественного решения.
    at: "2023-03-04 03:00:00"
    grade: DT_SUMMER
    overrides:
      H_Q21: .nan

  - id: sensor_conflict
    title: "Расхождение независимых анализаторов серы — неисправность прибора"
    why: >
      Поточный анализатор Q21 показывает 3 мг/кг, выгрузка ПАК — около 9.
      Ни одно значение нельзя считать верным. Агент данных обязан это
      заметить (проверка согласованности источников) и заблокировать цикл.
    at: "2024-09-15 20:00:00"
    grade: DT_SUMMER
    overrides:
      H_Q21: 3.0

  - id: severe_regime
    title: "Тяжёлый режим конца цикла катализатора — конфликт качества и надёжности"
    why: >
      Конец цикла катализатора: перепад давления на реакторе Р-202 у верхней
      границы наблюдавшегося диапазона, кратность циркуляции водорода снижена,
      расход квенча упал. Одновременно утяжелилось сырьё — агент качества
      хотел бы поднять температуру, но агент надёжности присваивает режиму
      индекс тяжести выше аварийного порога и ЗАПРЕЩАЕТ повышение температуры.
      Проверяется лексикографическое разрешение конфликта: система обязана
      найти обходной путь (давление, водород, нагрузка), а не «дожать»
      качество за счёт ресурса оборудования.
    at: "2024-04-26 20:00:00"
    grade: DT_SUMMER
    overrides:
      H_W10: 8.0
      H_P24: 0.42
      H_F15: 2400.0
    lab_overrides:
      "HT_FEED:Mass.Sulfur": 1.70

  - id: blend_cetane
    title: "Блендинг при дефиците цетанового числа — экономика присадки"
    why: >
      Все доступные партии имеют низкое цетановое число. Единственный способ
      выполнить требование — присадка, которая в 100 раз дороже ДТ.
      Проверяется, что линейная программа находит МИНИМАЛЬНУЮ дозировку, а не
      «любую допустимую».
    at: "2024-09-15 20:00:00"
    grade: DT_SUMMER
    tanks:
      - {name: "Р-1 глубокая очистка", sulfur_mg_kg: 3.0,  t95_c: 344.0, cetane: 49.5, density: 834.0}
      - {name: "Р-2 базовый режим",    sulfur_mg_kg: 8.0,  t95_c: 347.0, cetane: 48.8, density: 836.0}
      - {name: "Р-3 мягкий режим",     sulfur_mg_kg: 15.0, t95_c: 352.0, cetane: 48.0, density: 840.0}

  - id: blend_infeasible
    title: "Допустимой рецептуры нет — честный отказ агента блендинга"
    why: >
      Во всех резервуарах сера выше норматива. Никакая комбинация долей не даёт
      10 мг/кг. Ожидаемое поведение — feasible=false и понятная причина,
      а не «наименее плохая» рецептура.
    at: "2024-09-15 20:00:00"
    grade: DT_SUMMER
    tanks:
      - {name: "Р-1", sulfur_mg_kg: 12.0, t95_c: 349.0, cetane: 52.0, density: 836.0}
      - {name: "Р-2", sulfur_mg_kg: 14.0, t95_c: 351.0, cetane: 51.5, density: 838.0}
