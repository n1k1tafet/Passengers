# ---------------------------------------------------------------------------
# РЕЕСТР ТЕГОВ. Роль каждого тега + вердикт аудита семантики.
#
# ТЗ прямо требует: «Смысл тега берите из справочника КИП. Не делайте вывод о
# физическом смысле только по букве в коротком имени». Мы пошли дальше и
# сверили КАЖДЫЙ ключевой тег с данными (см. reports/01_tag_audit.md).
# Поле `audit` фиксирует результат этой сверки:
#   ok        — описание КИП согласуется с данными;
#   expert    — описание переопределено прямым ответом эксперта;
#   scaled    — данные соответствуют описанию с точностью до масштаба историка;
#   suspect   — описание КИП не согласуется с данными (найден сдвиг строк);
#   dead      — тег непригоден (постоянный сентинел).
# ---------------------------------------------------------------------------
version: "1.0"

units:
  # Единицы приведены к тем, что подтверждаются данными/формулами. Где
  # масштаб историка отличается от физического, указан `scale_to_si`.
  note: "value_SI = value_raw * scale_to_si"

hydrotreater:                # установка 24-2000, файл 242000_tags.csv
  manipulated:               # управляющие воздействия
    - tag: P8
      desc: "Полисеп. Реактор Р-202. Температура ГСС на входе"
      role: MV
      audit: expert
      audit_note: >
        Эксперт прямо назвал P8 управляющей переменной «температура».
        В сыром виде медиана 0.174 — это шкала историка. Физическая
        интерпретация (x2000 -> ~348 °C) согласуется с T5 (выход Р-201,
        ~370 °C) и подтверждается тем, что эксперт в формуле T90 применил
        к соседнему расходному тегу тот же делитель 2000.
      unit_raw: "ед. историка"
      unit_si: "degC"
      scale_to_si: 2000.0
      scale_confidence: assumption
      direction_on_sulfur: down       # рост температуры -> падение серы
    - tag: T11
      desc: "Расход сырья на установку (массовый)"
      role: MV
      audit: expert
      audit_note: >
        Эксперт прямо назвал T11 управляющей переменной «расход сырья».
        ВНИМАНИЕ: численно T11 коллинеарен температурному кластеру
        (corr(T11,T5)=0.996), поэтому в моделях он используется только
        совместно с явным ограничением на коллинеарность (см. deadtime.py).
      unit_raw: "т/ч"
      unit_si: "t/h"
      scale_to_si: 1.0
      direction_on_sulfur: up
    - tag: F19
      desc: "Полисеп. Реактор Р-202. Давление на входе"
      role: MV
      audit: expert
      unit_raw: "ед. историка"
      unit_si: "MPa"
      scale_to_si: 0.02              # 213.7 -> 4.27 МПа, согласуется с P3=3.66 МПа на сепараторе
      scale_confidence: assumption
      direction_on_sulfur: down
    - tag: F15
      desc: "Полисеп. Расход квенча в реактор Р-202"
      role: MV_secondary
      audit: scaled
      audit_note: "Эксперт в исправленной формуле T90 использует F15/2000 — принят как физический масштаб."
      unit_raw: "ед. историка"
      unit_si: "усл."
      scale_to_si: 0.0005
      direction_on_sulfur: up
    - tag: P24
      desc: "Расход свежего ВСГ с КЦА на установку"
      role: MV_secondary
      audit: ok
      unit_raw: "усл."
      unit_si: "усл."
      scale_to_si: 1.0
      direction_on_sulfur: down

  controlled:                # контролируемые показатели
    - tag: Q21
      desc: "Содержание серы в гидроочищенном ДТ (поточный анализатор)"
      role: CV
      audit: expert
      audit_note: >
        Справочник КИП приписывает Q21 «расход газа поддува», однако эксперт
        прямо ответил: «Q21 — содержание серы на выходе, измеряется в ppm,
        307 — это выброс». Проверка по данным подтверждает: сверка с ЛИМС
        Mg.Sulfur даёт смещение +0.06 мг/кг и MAE 1.31 — лучший результат
        среди всех тегов установки.
      unit_raw: "mg/kg"
      unit_si: "mg/kg"
      scale_to_si: 1.0
    - tag: F25
      desc: "APC. Показания виртуального анализатора «Температура вспышки ГОДТ»"
      role: CV
      audit: scaled
      audit_note: "Отношение к лабораторной вспышке ~194; при делении на 200 MAE 7.8 °C."
      unit_raw: "ед. историка"
      unit_si: "degC"
      scale_to_si: 0.005
      scale_confidence: assumption
    - tag: W10
      desc: "Реактор Р-202. Перепад давления"
      role: CV_reliability
      audit: ok
      unit_raw: "усл."
      unit_si: "усл."
      scale_to_si: 1.0

  suspect:                   # теги, описание которых опровергнуто данными
    - tag: T6
      desc_kip: "Поточный анализатор серы в дизельном топливе"
      verdict: "corr(T6,T5)=0.998 — это дубль температуры, не анализатор серы. Корреляция с лабораторной серой 0.09."
    - tag: W7
      desc_kip: "Блок стабилизации. Поточный анализатор содержания серы в ГО ДТ"
      verdict: "Корреляция с лабораторной серой -0.05. Используется только как вход исправленных формул ВАК."
    - tag: P13
      desc_kip: "Трубопровод на выходе из реактора Р-202: Качество продукции по S"
      verdict: "Корреляция с лабораторной серой 0.00. Численно ведёт себя как давление (3.7-4.0)."
    - tag: F22
      desc_kip: "Блок стабилизации. Расход газа поддува на входе в К-201Температура в сепараторе С-205"
      verdict: >
        В ячейке справочника СКЛЕЕНЫ ДВА ОПИСАНИЯ — это и есть источник
        сдвига строк в листе «КИП» для установки 24-2000. Подробности в
        reports/01_tag_audit.md.

avt:                         # установка ЭЛОУ-АВТ-6, файл avt_tags.csv
  manipulated:
    - {tag: T6,  desc: "Температура низа К-1 (~ выход печи П-1/1)", role: MV, audit: ok,
       unit_si: "degC", scale_to_si: 1.0, scheme: "лист 1, зелёный TC на выходе П-1/1"}
    - {tag: T33, desc: "Температура низа К-2 (~ выход печей П-1/2, П-1/3)", role: MV, audit: ok,
       unit_si: "degC", scale_to_si: 1.0, scheme: "лист 2, зелёный TI низа К-2"}
    - {tag: T55, desc: "Температура на выходе из печи П-3 (в К-10)", role: MV, audit: ok,
       unit_si: "degC", scale_to_si: 1.0, scheme: "лист 3, зелёный TC на выходе П-3"}
    - {tag: P4,  desc: "Давление низа К-1", role: MV, audit: ok,
       unit_si: "MPa", scale_to_si: 1.0, scheme: "лист 1, зелёный PIRC верха К-1"}
    - {tag: P67, desc: "Давление верха К-2", role: MV, audit: suspect,
       unit_si: "MPa", scale_to_si: 1.0,
       audit_note: "Медиана 1.12, 1 % выбросов 307. Три тега (P21,P22,P23,P67) описывают давление К-2 — дубли."}
    - {tag: F19, desc: "Расход острого орошения К-2", role: MV, audit: ok,
       unit_si: "t/h", scale_to_si: 1.0}
    - {tag: F14, desc: "Расход 1-го ЦО в К-2", role: MV_secondary, audit: ok, unit_si: "t/h", scale_to_si: 1.0}
    - {tag: F64, desc: "Расход 3-го ЦО в К-2", role: MV_secondary, audit: ok, unit_si: "t/h", scale_to_si: 1.0}

  controlled:
    - {tag: F30, desc: "Расход фр. 290-350 °C с установки", role: CV, audit: ok, unit_si: "t/h", scale_to_si: 1.0}
    - {tag: F32, desc: "Расход фр. 240-290 °C с установки", role: CV, audit: ok, unit_si: "t/h", scale_to_si: 1.0}
    - {tag: W70, desc: "Массовый расход фр. 290-350 °C с установки", role: CV, audit: ok, unit_si: "t/h", scale_to_si: 1.0}
    - {tag: F65, desc: "Производительность К-2 по отбензиненной нефти", role: CV, audit: ok, unit_si: "t/h", scale_to_si: 1.0}

  disturbance:
    - {tag: F7, desc: "Расход обессоленной нефти (3-й ход)", role: DV, audit: ok, unit_si: "t/h", scale_to_si: 1.0}
    - {tag: F8, desc: "Расход обессоленной нефти (1-й ход)", role: DV, audit: ok, unit_si: "t/h", scale_to_si: 1.0}
    - {tag: F9, desc: "Расход обессоленной нефти (2-й ход)", role: DV, audit: ok, unit_si: "t/h", scale_to_si: 1.0}

  dead:
    - tag: D10
      desc_kip: "Плотность. Тр-д подачи обессоленной и обезвоженной нефти"
      verdict: >
        99.995 % значений равны сентинелу 307 — тег мёртв за весь период.
        Плотность сырья берётся только из ЛИМС; при её отсутствии агент
        качества снижает уверенность и об этом сообщается оператору.
    - tag: F26
      desc_kip: "Расход пара в К-6"
      verdict: "37.6 % сентинелов и 62 % отрицательных значений — тег непригоден."
    - tag: P52
      desc_kip: "Перепад давления над 4-й пакетной насадкой К-10"
      verdict: "49 % значений — ровно -0.0, 65 % отрицательных. Непригоден."
